[package]
name = "desktop"
version = "0.1.0"
description = "Zero Productivity Tracker"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
zero_core = { path = "../../../packages/core" }
database = { path = "../../../packages/database" }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
futures = "0.3.34"
rusqlite = { version = "0.31.0", features = ["bundled"] }
keyring = "3.2"
uuid = { version = "1.26.0", features = ["v4"] }
base64 = "0.22.1"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58.0"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_System_Power"
]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.27.0"
